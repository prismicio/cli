name: validate

on: push

jobs:
  format:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - id: format
        continue-on-error: true
        run: npm run format -- --check
      - name: Report format failures
        if: steps.format.outcome == 'failure'
        run: echo "::warning::Code is not formatted. Run \`npm run format\` locally."

  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    env:
      MODE: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: test (Node.js ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        node: [22, 24, 26]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run unit
        env:
          E2E_PRISMIC_EMAIL: ${{ secrets.E2E_PRISMIC_EMAIL }}
          E2E_PRISMIC_PASSWORD: ${{ secrets.E2E_PRISMIC_PASSWORD }}

  test-win32:
    name: test windows (Node.js ${{ matrix.node }})
    runs-on: blacksmith-4vcpu-windows-2025
    strategy:
      matrix:
        node: [24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run unit
        env:
          E2E_PRISMIC_EMAIL: ${{ secrets.E2E_PRISMIC_EMAIL }}
          E2E_PRISMIC_PASSWORD: ${{ secrets.E2E_PRISMIC_PASSWORD }}

  types:
    name: "types (TypeScript ${{ matrix.typescript }})"
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    strategy:
      matrix:
        typescript: ["5", "6", "7"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }} && npx tsc --version
      - run: npm run types
