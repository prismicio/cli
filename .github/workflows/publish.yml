name: publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  release:
    if: github.event_name == 'push' && github.repository_owner == 'prismicio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      MODE: production
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        continue-on-error: true
        with:
          release-type: node
      - uses: actions/checkout@v7
        if: steps.release.outputs.release_created == 'true'
      - uses: actions/setup-node@v7
        if: steps.release.outputs.release_created == 'true'
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
      - if: steps.release.outputs.release_created == 'true'
        run: npm ci
      - name: "Publish release"
        if: steps.release.outputs.release_created == 'true'
        run: npm publish

  prerelease:
    if: "!cancelled() && github.repository_owner == 'prismicio'"
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MODE: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: "Install npm with OIDC dist-tag support"
        run: npm install --global npm@11.21.0

      # npm deprecate does not support OIDC. Publishing advances the tag instead.
      # Canary
      - name: "Publish canary"
        if: github.event_name == 'push' && needs.release.outputs.release_created != 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(jq -r '.version' package.json)
          npm ci
          npm version "${CURRENT_VERSION}-canary.${SHORT_SHA}" --no-git-tag-version
          npm publish --tag canary

      # Pull request
      - name: "Publish PR prerelease"
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(jq -r '.version' package.json)
          npm ci
          npm version "${CURRENT_VERSION}-pr.${{ github.event.number }}.${SHORT_SHA}" --no-git-tag-version
          npm publish --tag pr-${{ github.event.number }}

      - name: "Remove closed PR tag"
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          PACKAGE_NAME=$(jq -r ".name" package.json)
          TAG="pr-${{ github.event.number }}"
          VERSION=$(npm view "$PACKAGE_NAME" "dist-tags.$TAG")
          if [ -n "$VERSION" ]; then
            npm dist-tag rm "$PACKAGE_NAME" "$TAG"
          fi
